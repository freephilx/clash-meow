name: Release 分支自动发布

on:
  push:
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: dou-clash-prerelease
  cancel-in-progress: false

jobs:
  metadata:
    name: 读取应用版本
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 读取应用版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(xcodebuild \
            -project DouClash.xcodeproj \
            -scheme DouClash \
            -configuration Release \
            -showBuildSettings 2>/dev/null \
            | awk -F'= ' '{ lhs=$1; gsub(/^[ \t]+|[ \t]+$/, "", lhs); if (lhs == "MARKETING_VERSION") { print $2; exit } }')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: 无法读取有效的 MARKETING_VERSION: $version" >&2
            exit 1
          fi
          echo "package_version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: 运行 Swift 测试
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 运行测试
        run: swift test --no-parallel

  build:
    name: 构建 ${{ matrix.display_name }} DMG
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            display_name: Apple Silicon
          - architecture: x86_64
            display_name: Intel

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Mihomo 运行时
        run: ./scripts/prepare-mihomo-runtime.sh --arch "${{ matrix.architecture }}"

      - name: 构建 DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          PACKAGE_ARCHS: ${{ matrix.architecture }}
          SKIP_TESTS: "1"
        run: ./scripts/build-release.sh "${{ needs.metadata.outputs.package_version }}"

      - name: 保存 DMG
        uses: actions/upload-artifact@v7
        with:
          name: release-dmg-${{ matrix.architecture }}
          path: dist/release/*.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

  publish:
    name: 发布 GitHub Release
    needs:
      - metadata
      - test
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 下载双架构 DMG
        uses: actions/download-artifact@v8
        with:
          pattern: release-dmg-*
          path: dist/release
          merge-multiple: true

      - name: 创建 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
          RELEASE_TAG: Prerelease
          RELEASE_TARGET: ${{ github.sha }}
          RELEASE_REMOTE: origin
          MOVING_TAG: "1"
          PRERELEASE: "1"
          SKIP_BUILD: "1"
        run: ./scripts/release.sh
