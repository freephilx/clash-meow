name: Release 分支自动发布

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  release:
    name: 构建并上传双架构 DMG
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取应用版本
        shell: bash
        run: |
          set -euo pipefail
          version="$(xcodebuild \
            -project ClashMeow.xcodeproj \
            -scheme ClashMeow \
            -configuration Release \
            -showBuildSettings 2>/dev/null \
            | awk -F'= ' '{ lhs=$1; gsub(/^[ \t]+|[ \t]+$/, "", lhs); if (lhs == "MARKETING_VERSION") { print $2; exit } }')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: 无法读取有效的 MARKETING_VERSION: $version" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version-build.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: 构建并发布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
          RELEASE_REMOTE: origin
          BUILD_NUMBER: ${{ github.run_number }}
          PRERELEASE: "1"
        run: make release
